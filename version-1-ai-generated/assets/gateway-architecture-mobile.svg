<g><rect x="24" y="240" width="168" height="96" rx="3" fill="#f9f5e9" stroke="#b3a68e" stroke-width="1.15"/>
<path d="M25 250v-9h9m148 95h9v-9" fill="none" stroke="#883b26" stroke-width="1.7"/>
