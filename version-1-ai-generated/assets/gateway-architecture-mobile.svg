<path d="M242 250v-9h9m155 95h9v-9" fill="none" stroke="#883b26" stroke-width="1.7"/>
<use href="#icon-scheduler" transform="translate(254 252) scale(.83)" color="#883b26"/>
<text x="254" y="303" class="node">Scheduler</text>
<text x="254" y="324" class="effect" style="font-size:15.6px">Select &amp; forward</text>
