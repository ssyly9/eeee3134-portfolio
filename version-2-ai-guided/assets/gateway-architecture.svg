<g><rect x="33" y="318" width="192" height="111" rx="11" fill="#382e30" stroke="#856b63" stroke-width="1.15"/>
<rect x="43" y="327" width="37" height="31" rx="7" fill="#211b20" opacity=".63"/>
<use href="#icon-audit" transform="translate(46 330) scale(.83)" color="#a3d4c3"/>
<text x="46" y="381" class="node">Audit log</text>
<text x="46" y="402" class="effect">Record the write</text>
<text x="46" y="421" class="effect">Read back settings</text>
</g>
<g><rect x="274" y="318" width="310" height="111" rx="11" fill="#583b33" stroke="#a3d4c3" stroke-width="1.8"/>
<rect x="284" y="327" width="37" height="31" rx="7" fill="#211b20" opacity=".63"/>
