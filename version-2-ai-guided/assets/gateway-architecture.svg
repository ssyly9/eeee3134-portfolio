<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Sub2API gateway architecture</title>
<desc id="diagram-desc">The client sends a request. Sub2API authenticates the API key, identifies its group, selects an eligible upstream and streams the reply through the gateway to the client. Active probes, observed request success and p95 time to first token inform Sub2API Console. Its group controls set scheduling eligibility, priority and load factor. The audit log records writes and readback confirms applied settings.</desc>
<defs>
<linearGradient id="board" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#52352f"/><stop offset=".64" stop-color="#282327"/><stop offset="1" stop-color="#211b20"/></linearGradient>
<pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#967a6f"/></pattern>
<marker id="head-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1 1.5 8.5 5 1 8.5" stroke="#ffb283" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="head-control" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1 1.5 8.5 5 1 8.5" stroke="#a3d4c3" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="head-stream" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M1 1.5 8.5 5 1 8.5" stroke="#f5d7a4" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
<g id="icon-client" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="31" height="21" rx="2"/><path d="M1 7h31m-24 5 4 3-4 3m8-1h6M12 27h9m-5-4v4"/></g>
<g id="icon-auth" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="10" r="6"/><circle cx="8" cy="9" r="1"/><path d="m14 14 11 11 5-5-4-4-3 2-3-3"/></g>
<g id="icon-scheduler" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="10" width="8" height="8" rx="1"/><path d="M10 14h7m0 0V5h9m-9 9h9m-9 0v9h9"/><circle cx="29" cy="5" r="2.5"/><circle cx="29" cy="14" r="2.5"/><circle cx="29" cy="23" r="2.5"/></g>
<g id="icon-group" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="29" height="9" rx="2"/><rect x="2" y="15" width="29" height="9" rx="2"/><path d="M6 6.5h6m-6 13h6m11-13h3m-3 13h3"/></g>
<g id="icon-signals" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 17h6l4-11 6 20 5-14 3 5h8"/></g>
<g id="icon-console" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h9m6 0h17M1 14h20m6 0h6M1 23h5m6 0h21"/><circle cx="13" cy="5" r="3"/><circle cx="24" cy="14" r="3"/><circle cx="9" cy="23" r="3"/></g>
<g id="icon-audit" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1h17l7 7v18H4zM20 2v7h7M8 12h5m-5 4h5m1 4 4 3 7-8"/></g>
</defs>
<style>
text { fill:#fff0d9; font-family:Arial,sans-serif }
.display { font:600 35px Arial,sans-serif; letter-spacing:-1.7px }
.folio { fill:#f0d7bd; font:600 12px Consolas,monospace; letter-spacing:1.6px }
.section { fill:#ffb283; font:600 13px Consolas,monospace; letter-spacing:1.25px }
.node { font:600 21px Arial,sans-serif; letter-spacing:-.6px }
.effect { fill:#f0d7bd; font-size:16px } .legend { fill:#f0d7bd; font-size:15px }
.wire {fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="880" height="486" fill="url(#board)"/>
<rect x="0" y="0" width="880" height="486" fill="url(#grid)" opacity=".19"/>
<text x="33" y="33" class="folio">SUB2API  /  GATEWAY</text>
<text x="33" y="79" class="display" style="font-size:41px">Routing architecture</text>
