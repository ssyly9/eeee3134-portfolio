<text x="287" y="381" class="node">Sub2API Console</text>
<text x="287" y="402" class="effect">Group health &amp; eligibility</text>
<text x="287" y="421" class="effect">Priority · load factor</text>
</g>
<g><rect x="631" y="318" width="216" height="111" rx="11" fill="#382e30" stroke="#856b63" stroke-width="1.15"/>
<rect x="641" y="327" width="37" height="31" rx="7" fill="#211b20" opacity=".63"/>
