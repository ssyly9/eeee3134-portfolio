</g>
<g><rect x="449" y="140" width="173" height="103" rx="11" fill="#583b33" stroke="#ffb283" stroke-width="1.8"/>
<rect x="459" y="149" width="37" height="31" rx="7" fill="#211b20" opacity=".63"/>
<use href="#icon-scheduler" transform="translate(462 152) scale(.83)" color="#ffb283"/>
<text x="462" y="203" class="node">Scheduler</text>
<text x="462" y="224" class="effect">Select &amp; forward</text>
</g>
<g><rect x="663" y="140" width="184" height="103" rx="11" fill="#382e30" stroke="#856b63" stroke-width="1.15"/>
<rect x="673" y="149" width="37" height="31" rx="7" fill="#211b20" opacity=".63"/>
<use href="#icon-group" transform="translate(676 152) scale(.83)" color="#ffb283"/>
<text x="676" y="203" class="node">Upstream group</text>
<text x="676" y="224" class="effect">Eligible member</text>
</g>
<path class="wire" d="M202 190h33" stroke="#ffb283" stroke-width="2.8" marker-end="url(#head-accent)"/>
<path class="wire" d="M409 190h37" stroke="#ffb283" stroke-width="2.8" marker-end="url(#head-accent)"/>
